name: Docker

on:
  push:
    paths-ignore:
      - "README.md"
    branches:
      - master
      - feature/**
  # Lets any branch be built on demand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare platform name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Set image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Set image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # master publishes "latest"; every other branch publishes under its own
      # slug (feature/js-local-time -> feature-js-local-time), so test builds
      # never overwrite the tags that deployments follow.
      - name: Set image tag
        run: |
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            tag=latest
          else
            tag="${GITHUB_REF_NAME//[^a-zA-Z0-9._-]/-}"
            tag="${tag,,}"
          fi
          echo "IMAGE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "Publishing as ${tag}"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest (branch tag + commit SHA)
        working-directory: ${{ runner.temp }}/digests
        run: |
          sources=()
          for f in */*; do
            sources+=("${REGISTRY}/${IMAGE_NAME}@sha256:$(basename "$f")")
          done
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}" \
            "${sources[@]}"

      - name: Create arm64 tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          arm_digest=$(basename "$(ls digests-linux-arm64/*)")
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}-arm64" \
            "${REGISTRY}/${IMAGE_NAME}@sha256:${arm_digest}"

      - name: Inspect images
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}-arm64"
